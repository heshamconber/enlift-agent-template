name: CI

on: [push, pull_request]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest tests/ -v

  scan:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt
      - name: Check no unfilled placeholders in RUNBOOK
        run: |
          count=$(grep -c '<[^>]*>' docs/RUNBOOK.md || true)
          if [ "$count" -gt 0 ]; then
            echo "WARNING: RUNBOOK.md still has $count unfilled placeholders."
            echo "Derived agents must fill all placeholders before shipping to production."
          fi
