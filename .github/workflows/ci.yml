name: CI

on: [push, pull_request]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest tests/ -v

  scan:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt
      - name: Check no unfilled placeholders in RUNBOOK
        run: |
          angle_count=$(grep -c '<[^>]*>' docs/RUNBOOK.md || true)
          fillin_count=$(grep -c 'FILL_IN:' docs/RUNBOOK.md || true)
          total=$((angle_count + fillin_count))
          if [ "$total" -gt 0 ]; then
            echo "ERROR: RUNBOOK.md has $angle_count angle-bracket and $fillin_count FILL_IN: placeholders."
            echo "Fill all placeholders before deploying to production."
            exit 1
          fi

      - name: Reject .env baked into container image
        run: |
          if [ -f Dockerfile ] && grep -qn "COPY .env" Dockerfile; then
            echo "ERROR: .env must not be COPYed into the container image."
            exit 1
          fi

      - name: Check credential rotation dates in .env.example
        run: |
          python3 - <<'EOF'
          import re, sys
          from datetime import datetime, timezone, timedelta

          MAX_AGE = timedelta(days=90)
          now = datetime.now(timezone.utc)
          text = open(".env.example").read()
          dates = re.findall(r"Last rotated:\s*(\d{4}-\d{2}-\d{2})", text)
          stale = []
          for d in dates:
              try:
                  rotated = datetime.strptime(d, "%Y-%m-%d").replace(tzinfo=timezone.utc)
                  if now - rotated > MAX_AGE:
                      stale.append(d)
              except ValueError:
                  pass
          if stale:
              print(f"ERROR: credentials not rotated in 90+ days: {stale}", file=sys.stderr)
              sys.exit(1)
          else:
              print("Credential rotation dates OK (or no dated entries found).")
          EOF

      - name: Check AUDIT_LOG_PATH points outside container
        env:
          AUDIT_LOG_PATH: ${{ vars.AUDIT_LOG_PATH }}
        run: |
          if [ -z "$AUDIT_LOG_PATH" ] || [ "$AUDIT_LOG_PATH" = "./audit" ] || [ "$AUDIT_LOG_PATH" = "audit" ]; then
            echo "ERROR: AUDIT_LOG_PATH is not set or points to local ./audit."
            echo "Set AUDIT_LOG_PATH to a blob/S3/network path in the production environment."
            exit 1
          else
            echo "AUDIT_LOG_PATH is set to a non-local path: $AUDIT_LOG_PATH"
          fi

  container-scan:
    runs-on: ubuntu-latest
    needs: scan
    steps:
      - uses: actions/checkout@v4

      - name: Build container image
        run: docker build -t enlift-agent-scan .

      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: enlift-agent-scan
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          format: 'table'
